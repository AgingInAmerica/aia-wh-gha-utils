name: 'Repo Dispatch'
description: 'Repository Dispatch GitHub Action'
inputs:
  event_type:
    description: 'Event Type'
    required: true
  client_payload:
    description: 'Client Payload'
    default: '{}'
    required: false
  repository:
    description: ''
    required: false
  wait:
    description: 'Whether to wait triggered workflow to finish'
    required: false
    default: 'false'
  # Secrets
  gh_token:
    description: 'GitHub Token'
    required: true
runs:
  using: "composite"
  steps:
    - name: Run Repo Workflow
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.gh_token || github.token }}
        REPO: ${{ inputs.repository || github.repository }}
      run: |
        echo "Call Dispatch API"
        BODY=$(jq -n \
          --arg event_type "${{ inputs.event_type }}" \
          --argjson client_payload '${{ inputs.client_payload }}' \
          '$ARGS.named'
        )
        gh api "repos/${{ env.REPO }}/dispatches" --input - <<< $BODY

        if [[ "${{ inputs.wait }}" == "false" ]]; then
          echo "Pipeline finished. Graceful exit."
          exit 0
        fi

        CREATED_AT=$(date --date="1 minute ago" +%Y-%m-%dT%H:%M:%SZ)

        WFID=""

        for i in {1..20}; do
          echo "Looking for triggered repository_dispatch workflow run, attempt $i/20..."

          WFID=$(gh run list -R "${REPO}" \
            --json databaseId,event,status,createdAt \
            -q '.[] | select(.event == "repository_dispatch" and .createdAt >= "'"$CREATED_AT"'") | .databaseId' \
            | head -n 1)

          if [[ -n "$WFID" ]]; then
            echo "Found workflow run ID: $WFID"
            break
          fi

          sleep 5
        done

        if [[ -z "$WFID" ]]; then
          echo "ERROR: repository_dispatch was sent, but no matching workflow run was found in ${REPO}"
          echo "Recent workflow runs:"
          gh run list -R "${REPO}" --limit 10
          exit 1
        fi

        gh run watch "$WFID" -R "${REPO}" --exit-status 69
